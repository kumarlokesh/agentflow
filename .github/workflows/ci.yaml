name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Go module in the repo. Submodules point at the root module via
        # `replace`, so each one is checked on its own (no go.work needed).
        module:
          - .
          - providers/anthropic
          - providers/openai
          - providers/retry
          - observe/otel
          - examples/anthropic-agent
          - examples/openai-agent
          - examples/otel-agent
          - examples/mcp-agent
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      # Use exactly the Go version set up below; never auto-download a newer toolchain.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # 1. The module's minimum supported Go version (the `go` line in its go.mod).
      - name: Set up Go (minimum, from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet (minimum Go)
        run: go vet ./...
      - name: Test (minimum Go)
        run: go test -race -count=1 ./...

      # 2. Latest stable Go.
      - name: Set up Go (stable)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Vet (stable Go)
        run: go vet ./...
      - name: Test (stable Go)
        run: go test -race -count=1 ./...

      # 3. Lint and format checks (gofmt, goimports, errcheck, staticcheck, …) per .golangci.yaml.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yaml
